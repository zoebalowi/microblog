name: Deploy

on:
  push:
    tags: 
      - 'v*'

jobs:
  test:
     uses: ./.github/workflows/ci.yml


  deploy:
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile_prod
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/microblog:${{ steps.version.outputs.version }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}

            - name: Install Ansible
        run: |
          python3 -m pip install --user ansible

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy with Ansible
        run: |
          ansible-playbook \
            -i ansible/prod_hosts \
            ansible/start_instances.yml
            
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/deploy.txt

      - name: Install Ansible
        run: pip install -r requirements/deploy.txt

      - name: Save the ssh key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Run the playbook
        working-directory: ansible
        run: ansible-playbook -i prod_hosts deploy_app.yml --private-key ~/.ssh/id_ed25519 -e "db_password=$DB_PASSWORD"
          
