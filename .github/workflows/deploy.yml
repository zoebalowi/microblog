name: Deploy

on:
  push:
    tags: 
      - 'v*'

jobs:
  test:
     uses: ./.github/workflows/ci.yml


  deploy:
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile_prod
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/microblog:${{ steps.version.outputs.version }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/deploy.txt

      - name: Install Ansible and Azure dependencies
        run: |
          pip install -r requirements/deploy.txt
          ansible-galaxy collection install -r ansible/requirements.yml
          pip install -r ~/.ansible/collections/ansible_collections/azure/azcollection/requirements.txt

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/azure
          chmod 600 ~/.ssh/azure

      - name: Deploy with Ansible
        run: |
          ansible-playbook \
            -i ansible/prod_hosts \
            ansible/start_instances.yml

      - name: Save the ssh key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/azure
          chmod 600 ~/.ssh/azure
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Run the playbook
        working-directory: ansible
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          MICROBLOG_IMAGE_TAG: ${{ steps.version.outputs.version }}
          MICROBLOG_SECRET_KEY: ${{ secrets.MICROBLOG_SECRET_KEY }}
        run: ansible-playbook -i prod_hosts appserver.yml --private-key ~/.ssh/azure -e "mysql_password=$DB_PASSWORD"
          
