---
# Here you can add variables that will be available for all hosts.
ansible_python_interpreter: "python3"

# Where the VMs, network and IP addresses are created. Must be a location that your resource group and the school's policy allow.
region: northeurope
resource_group: DIDA-DIVR24-DV1673-H26-LP2 # Change me
domain_name: devopsdizo.me # Change me

admin_email: divr24@student.bth.se

# The VM size. Azure's policy for the course only allows some sizes, and a size can be out of capacity in a region.
vm_size: Standard_B2ts_v2

vmtags:
    StudentId: divr24 # Change me


bootstrap_ssh_key: "/home/dev/.ssh/azure.pub"

pub_ssh_key_location:
    - "{{ playbook_dir }}/ssh_key/didrik_ssh"
    - "{{ playbook_dir }}/ssh_key/zoe_ssh"


# The user Azure creates on the VMs. 10-first-minutes removes it.
root_user: azureuser

server_user: "deploy"
server_user_groups:
    -   sudo

mysql_root_password: "rootpassword"
mysql_database: "microblog"
mysql_user: "microblog"
mysql_password: "microblogpassword"

# Let's Encrypt only gives 5 real certificates a week for the same domain. Use true while you build and test,
# the certificate is then not trusted by browsers. Use false when everything works to get a real certificate.
certbot_staging: true
