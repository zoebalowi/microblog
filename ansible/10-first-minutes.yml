
---
- name: Select an available SSH user
  hosts: devops
  gather_facts: false
  remote_user: "{{ root_user }}"

  tasks:
    - name: Try to log in as the Azure user
      ansible.builtin.ping:
      ignore_unreachable: true
      register: azure_user_login

    - name: Try to log in as deploy if the Azure user is unavailable
      ansible.builtin.ping:
      ignore_unreachable: true
      register: deploy_user_login
      vars:
        ansible_user: "{{ server_user }}"
      when: azure_user_login is unreachable

    - name: Stop if neither SSH user is available
      ansible.builtin.fail:
        msg: >-
          Could not connect as {{ root_user }} or {{ server_user }}.
          {{ root_user }} connection error:
          {{ azure_user_login.msg | default('No SSH error details returned.') }}
          {{ server_user }} connection error:
          {{ deploy_user_login.msg | default('No SSH error details returned.') }}
      when:
        - azure_user_login is unreachable
        - deploy_user_login is unreachable

    - name: Use deploy when its SSH login succeeds
      ansible.builtin.set_fact:
        ansible_user: "{{ server_user }}"
      when:
        - azure_user_login is unreachable
        - deploy_user_login is not unreachable

- name: Run first minutes role
  hosts: devops
  remote_user: "{{ root_user }}"
  become: true
  become_method: sudo

  roles:
    - 10-first-minutes
